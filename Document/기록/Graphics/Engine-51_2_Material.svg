<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 520" width="1240" height="520" font-family="'Segoe UI', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" role="img" aria-label="2단계 머터리얼 — 지금은 머터리얼을 저장하지 않고 쓰는 쪽이 HLSL 조각을 써서 머터리얼마다 컴파일하며, 바뀐 뒤에는 JGMaterial 에셋이 표준 Lit 머터리얼을 만들어 강참조로 들고 메시 슬롯에 경로로 저장되며, 같은 셰이더는 캐시로 한 번만 컴파일하고 텍스처는 sRGB · 밉을 쓴다">
